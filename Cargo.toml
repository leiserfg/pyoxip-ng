[package]
name = "pyoxipng-ng"
version = "10.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "oxipng"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39", "extension-module"] }
oxipng = { version = "10.2.*" }
